<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex - Offline</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card: #121826;
        --border: #1f293d;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #22c55e;
        --accent-hover: #16a34a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        background-color: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2rem;
        max-width: 28rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon-circle {
        width: 4rem;
        height: 4rem;
        background-color: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.2);
        color: var(--accent);
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }
      .icon-circle svg {
        width: 2rem;
        height: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      button {
        background-color: var(--accent);
        color: #052e16;
        font-weight: 600;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.15s ease-in-out;
      }
      button:hover {
        background-color: var(--accent-hover);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 0.25rem;
        color: var(--muted);
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="icon-circle" aria-hidden="true">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414M3 3l18 18"></path>
        </svg>
      </div>
      <h1>Nincs internetkapcsolat / Offline</h1>
      <p>
        Az Apex jelenleg nem éri el a hálózatot. A már betöltött edzésterv és korábbi adatok elérhetők a memóriában.
      </p>
      <p style="font-size: 0.85rem; color: #6b7280;">
        You are currently offline. Check your internet connection to sync your latest metrics.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">
          Újrapróbálás / Retry
        </button>
      </div>
      <div class="badge">Apex Athletic Platform</div>
    </main>
  </body>
</html>
